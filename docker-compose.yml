name: ziee

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ziee}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ziee"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage

  migrate:
    image: ${ZIEE_IMAGE:-registry.digitalocean.com/ziee/ziee:main}
    restart: "no"
    command: ["migrate", "up", "-c", "/app/configs/config.yml"]
    environment:
      ZIEE_SERVER_URL: ${ZIEE_SERVER_URL:-http://localhost}
      ZIEE_DATABASE_HOST: postgres
      ZIEE_DATABASE_PORT: "5432"
      ZIEE_DATABASE_USERNAME: ${POSTGRES_USER:-postgres}
      ZIEE_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      ZIEE_DATABASE_NAME: ${POSTGRES_DB:-ziee}
      ZIEE_AI_QDRANT_HOST: qdrant
      ZIEE_AI_QDRANT_PORT: "6334"
      ZIEE_LOCAL_PATH: /app/var/data
    volumes:
      - ./etc/config/config.yml:/app/configs/config.yml:ro
      - ziee_data:/app/var
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

  ziee:
    image: ${ZIEE_IMAGE:-registry.digitalocean.com/ziee/ziee:main}
    restart: unless-stopped
    command: ["server", "-c", "/app/configs/config.yml"]
    environment:
      ZIEE_SERVER_URL: ${ZIEE_SERVER_URL:-http://localhost}
      ZIEE_DATABASE_HOST: postgres
      ZIEE_DATABASE_PORT: "5432"
      ZIEE_DATABASE_USERNAME: ${POSTGRES_USER:-postgres}
      ZIEE_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      ZIEE_DATABASE_NAME: ${POSTGRES_DB:-ziee}
      ZIEE_AI_QDRANT_HOST: qdrant
      ZIEE_AI_QDRANT_PORT: "6334"
      ZIEE_LOCAL_PATH: /app/var/data
      ZIEE_AI_OROUTE_API_KEY: ${ZIEE_AI_OROUTE_API_KEY:-}
      ZIEE_RESEND_API_KEY: ${ZIEE_RESEND_API_KEY:-}
      ZIEE_STRIPE_SECRET_KEY: ${ZIEE_STRIPE_SECRET_KEY:-}
      ZIEE_STRIPE_WEBHOOK_SECRET: ${ZIEE_STRIPE_WEBHOOK_SECRET:-}
    volumes:
      - ./etc/config/config.yml:/app/configs/config.yml:ro
      - ziee_data:/app/var
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./etc/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ziee

volumes:
  postgres_data:
  qdrant_data:
  ziee_data:
