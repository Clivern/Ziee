name: actx0

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-actx0}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d actx0"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage

  migrate:
    image: ${ACTX0_IMAGE:-registry.digitalocean.com/actx0/actx0:main}
    restart: "no"
    command: ["migrate", "up", "-c", "/app/configs/config.yml"]
    environment:
      ACTX0_SERVER_URL: ${ACTX0_SERVER_URL:-http://localhost}
      ACTX0_DATABASE_HOST: postgres
      ACTX0_DATABASE_PORT: "5432"
      ACTX0_DATABASE_USERNAME: ${POSTGRES_USER:-postgres}
      ACTX0_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      ACTX0_DATABASE_NAME: ${POSTGRES_DB:-actx0}
      ACTX0_AI_QDRANT_HOST: qdrant
      ACTX0_AI_QDRANT_PORT: "6334"
      ACTX0_LOCAL_PATH: /app/var/data
    volumes:
      - ./etc/config/config.yml:/app/configs/config.yml:ro
      - actx0_data:/app/var
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

  actx0:
    image: ${ACTX0_IMAGE:-registry.digitalocean.com/actx0/actx0:main}
    restart: unless-stopped
    command: ["server", "-c", "/app/configs/config.yml"]
    environment:
      ACTX0_SERVER_URL: ${ACTX0_SERVER_URL:-http://localhost}
      ACTX0_DATABASE_HOST: postgres
      ACTX0_DATABASE_PORT: "5432"
      ACTX0_DATABASE_USERNAME: ${POSTGRES_USER:-postgres}
      ACTX0_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      ACTX0_DATABASE_NAME: ${POSTGRES_DB:-actx0}
      ACTX0_AI_QDRANT_HOST: qdrant
      ACTX0_AI_QDRANT_PORT: "6334"
      ACTX0_LOCAL_PATH: /app/var/data
      ACTX0_AI_OROUTE_API_KEY: ${ACTX0_AI_OROUTE_API_KEY:-}
      ACTX0_RESEND_API_KEY: ${ACTX0_RESEND_API_KEY:-}
      ACTX0_STRIPE_SECRET_KEY: ${ACTX0_STRIPE_SECRET_KEY:-}
      ACTX0_STRIPE_WEBHOOK_SECRET: ${ACTX0_STRIPE_WEBHOOK_SECRET:-}
    volumes:
      - ./etc/config/config.yml:/app/configs/config.yml:ro
      - actx0_data:/app/var
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      migrate:
        condition: service_completed_successfully

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - ./etc/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - actx0

volumes:
  postgres_data:
  qdrant_data:
  actx0_data:
