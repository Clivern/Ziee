app:
  name: ${ACTX0_SERVER_NAME:-Ziee}
  mode: ${ACTX0_SERVER_MODE:-prod}
  port: ${ACTX0_SERVER_PORT:-8000}
  url: ${ACTX0_SERVER_URL:-http://localhost}
  timeout: ${ACTX0_SERVER_TIMEOUT:-50}
  worker_pool: ${ACTX0_SERVER_WORKER_POOL:-50}


  metrics:
    username: ${ACTX0_SERVER_PROM_METRICS_USERNAME:-admin}
    secret: ${ACTX0_SERVER_PROM_METRICS_SECRET:-secret}

  log:
    level: ${ACTX0_SERVER_LOG_LEVEL:-info}
    output: ${ACTX0_SERVER_LOG_OUTPUT:-stdout}
    format: ${ACTX0_SERVER_LOG_FORMAT:-json}

  mailer:
    provider: ${ACTX0_MAILER_PROVIDER:-resend}
    from: ${ACTX0_MAILER_FROM:-no_reply@actx0.com}
    resend:
      api_key: ${ACTX0_RESEND_API_KEY:-}

  database:
    rw:
      driver: ${ACTX0_DATABASE_DRIVER:-postgres}
      host: ${ACTX0_DATABASE_HOST:-postgres}
      port: ${ACTX0_DATABASE_PORT:-5432}
      username: ${ACTX0_DATABASE_USERNAME:-postgres}
      password: ${ACTX0_DATABASE_PASSWORD:-postgres}
      name: ${ACTX0_DATABASE_NAME:-actx0}
      max_open_conns: ${ACTX0_DATABASE_MAX_OPEN_CONNS:-25}
      max_idle_conns: ${ACTX0_DATABASE_MAX_IDLE_CONNS:-10}
      conn_max_lifetime: ${ACTX0_DATABASE_CONN_MAX_LIFETIME:-300}
    ro:
    - driver: ${ACTX0_DATABASE_DRIVER:-postgres}
      host: ${ACTX0_DATABASE_HOST:-postgres}
      port: ${ACTX0_DATABASE_PORT:-5432}
      username: ${ACTX0_DATABASE_USERNAME:-postgres}
      password: ${ACTX0_DATABASE_PASSWORD:-postgres}
      name: ${ACTX0_DATABASE_NAME:-actx0}
      max_open_conns: ${ACTX0_DATABASE_MAX_OPEN_CONNS:-25}
      max_idle_conns: ${ACTX0_DATABASE_MAX_IDLE_CONNS:-10}
      conn_max_lifetime: ${ACTX0_DATABASE_CONN_MAX_LIFETIME:-300}

  billing:
    provider: ${ACTX0_BILLING_PROVIDER:-stripe}
    secret_key: ${ACTX0_STRIPE_SECRET_KEY:-}
    webhook_secret: ${ACTX0_STRIPE_WEBHOOK_SECRET:-}
    product_id: ${ACTX0_STRIPE_PRODUCT_ID:-}
    prices:
      hobby: ${ACTX0_STRIPE_PRICE_HOBBY:-}
      growth: ${ACTX0_STRIPE_PRICE_GROWTH:-}
      starter: ${ACTX0_STRIPE_PRICE_STARTER:-}
      pro: ${ACTX0_STRIPE_PRICE_PRO:-}
    urls:
      checkout_success: ${ACTX0_STRIPE_CHECKOUT_SUCCESS_URL:-/billing/success}
      checkout_cancel: ${ACTX0_STRIPE_CHECKOUT_CANCEL_URL:-/billing/cancel}
      portal_return: ${ACTX0_STRIPE_PORTAL_RETURN_URL:-/billing}

  storage:
    provider: ${ACTX0_STORAGE_PROVIDER:-local}
    s3:
      bucket: ${ACTX0_S3_BUCKET:-actx0}
      region: ${ACTX0_S3_REGION:-us-east-1}
      endpoint: ${ACTX0_S3_ENDPOINT:-}
      access_key_id: ${ACTX0_S3_ACCESS_KEY_ID:-}
      secret_access_key: ${ACTX0_S3_SECRET_ACCESS_KEY:-}
      use_path_style: ${ACTX0_S3_USE_PATH_STYLE:-false}
      prefix: ${ACTX0_S3_PREFIX:-documents}
    local:
      path: ${ACTX0_LOCAL_PATH:-/app/var/data}

  ai:
    api_key: ${ACTX0_AI_OROUTE_API_KEY:-}
    embed:
      model: ${ACTX0_AI_OROUTE_EMBEDDING_MODEL:-openai/text-embedding-3-large}
      qdb:
        host: ${ACTX0_AI_QDRANT_HOST:-qdrant}
        port: ${ACTX0_AI_QDRANT_PORT:-6334}
        api_key: ${ACTX0_AI_QDRANT_API_KEY:-}
        use_tls: ${ACTX0_AI_QDRANT_USE_TLS:-false}
        vector_size: ${ACTX0_AI_QDRANT_VECTOR_SIZE:-1024}
        pool_size: ${ACTX0_AI_QDRANT_POOL_SIZE:-3}
    llm:
      lite:
        model: ${ACTX0_AI_LITE_LLM_MODEL:-cohere/command-r}
      large:
        model: ${ACTX0_AI_LARGE_LLM_MODEL:-openai/gpt-4o}

  cache:
    provider: ${ACTX0_CACHE_PROVIDER:-redis}
    redis:
      addr: ${ACTX0_REDIS_ADDR:-127.0.0.1:6379}
      password: ${ACTX0_REDIS_PASSWORD:-}
      db: ${ACTX0_REDIS_DB:-0}
      pool_size: ${ACTX0_REDIS_POOL_SIZE:-10}
      min_idle_conns: ${ACTX0_REDIS_MIN_IDLE_CONNS:-5}
