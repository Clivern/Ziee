app:
  name: ${ZIEE_SERVER_NAME:-Ziee}
  mode: ${ZIEE_SERVER_MODE:-prod}
  port: ${ZIEE_SERVER_PORT:-8000}
  url: ${ZIEE_SERVER_URL:-http://localhost}
  timeout: ${ZIEE_SERVER_TIMEOUT:-50}

  metrics:
    username: ${ZIEE_SERVER_PROM_METRICS_USERNAME:-admin}
    secret: ${ZIEE_SERVER_PROM_METRICS_SECRET:-secret}

  log:
    level: ${ZIEE_SERVER_LOG_LEVEL:-info}
    output: ${ZIEE_SERVER_LOG_OUTPUT:-stdout}
    format: ${ZIEE_SERVER_LOG_FORMAT:-json}

  mailer:
    provider: ${ZIEE_MAILER_PROVIDER:-resend}
    from: ${ZIEE_MAILER_FROM:-no_reply@ziee.com}
    resend:
      api_key: ${ZIEE_RESEND_API_KEY:-}

  oauth:
    github:
      client_id: ${ZIEE_GITHUB_OAUTH_CLIENT_ID:-}
      client_secret: ${ZIEE_GITHUB_OAUTH_CLIENT_SECRET:-}
      redirect_url: ${ZIEE_GITHUB_OAUTH_REDIRECT_URL:-}
      webhook_secret: ${ZIEE_GITHUB_WEBHOOK_SECRET:-}

  database:
    rw:
      driver: ${ZIEE_DATABASE_DRIVER:-postgres}
      host: ${ZIEE_DATABASE_HOST:-postgres}
      port: ${ZIEE_DATABASE_PORT:-5432}
      username: ${ZIEE_DATABASE_USERNAME:-postgres}
      password: ${ZIEE_DATABASE_PASSWORD:-postgres}
      name: ${ZIEE_DATABASE_NAME:-ziee}
      max_open_conns: ${ZIEE_DATABASE_MAX_OPEN_CONNS:-25}
      max_idle_conns: ${ZIEE_DATABASE_MAX_IDLE_CONNS:-10}
      conn_max_lifetime: ${ZIEE_DATABASE_CONN_MAX_LIFETIME:-300}
    ro:
    - driver: ${ZIEE_DATABASE_DRIVER:-postgres}
      host: ${ZIEE_DATABASE_HOST:-postgres}
      port: ${ZIEE_DATABASE_PORT:-5432}
      username: ${ZIEE_DATABASE_USERNAME:-postgres}
      password: ${ZIEE_DATABASE_PASSWORD:-postgres}
      name: ${ZIEE_DATABASE_NAME:-ziee}
      max_open_conns: ${ZIEE_DATABASE_MAX_OPEN_CONNS:-25}
      max_idle_conns: ${ZIEE_DATABASE_MAX_IDLE_CONNS:-10}
      conn_max_lifetime: ${ZIEE_DATABASE_CONN_MAX_LIFETIME:-300}

  billing:
    provider: ${ZIEE_BILLING_PROVIDER:-stripe}
    secret_key: ${ZIEE_STRIPE_SECRET_KEY:-}
    webhook_secret: ${ZIEE_STRIPE_WEBHOOK_SECRET:-}
    product_id: ${ZIEE_STRIPE_PRODUCT_ID:-}
    prices:
      hobby: ${ZIEE_STRIPE_PRICE_HOBBY:-}
      growth: ${ZIEE_STRIPE_PRICE_GROWTH:-}
      starter: ${ZIEE_STRIPE_PRICE_STARTER:-}
      pro: ${ZIEE_STRIPE_PRICE_PRO:-}
    urls:
      checkout_success: ${ZIEE_STRIPE_CHECKOUT_SUCCESS_URL:-/billing/success}
      checkout_cancel: ${ZIEE_STRIPE_CHECKOUT_CANCEL_URL:-/billing/cancel}
      portal_return: ${ZIEE_STRIPE_PORTAL_RETURN_URL:-/billing}

  storage:
    provider: ${ZIEE_STORAGE_PROVIDER:-local}
    s3:
      bucket: ${ZIEE_S3_BUCKET:-ziee}
      region: ${ZIEE_S3_REGION:-us-east-1}
      endpoint: ${ZIEE_S3_ENDPOINT:-}
      access_key_id: ${ZIEE_S3_ACCESS_KEY_ID:-}
      secret_access_key: ${ZIEE_S3_SECRET_ACCESS_KEY:-}
      use_path_style: ${ZIEE_S3_USE_PATH_STYLE:-false}
      prefix: ${ZIEE_S3_PREFIX:-documents}
    local:
      path: ${ZIEE_LOCAL_PATH:-/app/var/data}

  ai:
    api_key: ${ZIEE_AI_OROUTE_API_KEY:-}
    embed:
      model: ${ZIEE_AI_OROUTE_EMBEDDING_MODEL:-openai/text-embedding-3-large}
      qdb:
        host: ${ZIEE_AI_QDRANT_HOST:-qdrant}
        port: ${ZIEE_AI_QDRANT_PORT:-6334}
        api_key: ${ZIEE_AI_QDRANT_API_KEY:-}
        use_tls: ${ZIEE_AI_QDRANT_USE_TLS:-false}
        vector_size: ${ZIEE_AI_QDRANT_VECTOR_SIZE:-1024}
        pool_size: ${ZIEE_AI_QDRANT_POOL_SIZE:-3}
    llm:
      lite:
        model: ${ZIEE_AI_LITE_LLM_MODEL:-cohere/command-r}
      large:
        model: ${ZIEE_AI_LARGE_LLM_MODEL:-openai/gpt-4o}

  cache:
    provider: ${ZIEE_CACHE_PROVIDER:-redis}
    redis:
      addr: ${ZIEE_REDIS_ADDR:-127.0.0.1:6379}
      password: ${ZIEE_REDIS_PASSWORD:-}
      db: ${ZIEE_REDIS_DB:-0}
      pool_size: ${ZIEE_REDIS_POOL_SIZE:-10}
      min_idle_conns: ${ZIEE_REDIS_MIN_IDLE_CONNS:-5}

  nats:
    url: ${ZIEE_NATS_URL:-nats://127.0.0.1:4222}
    name: ${ZIEE_NATS_NAME:-ziee}
    queue: ${ZIEE_NATS_QUEUE:-ziee}
